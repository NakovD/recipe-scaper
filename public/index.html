<!doctype html>
<html lang="bg">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Брутално вкусно — локален архив</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Рецепти</h1>
		<div class="search-row">
			<div class="search-wrap">
				<div class="search-input-row">
					<input id="search-input" type="text" placeholder="Търси по заглавие или съставка...">
					<button id="clear-search" class="clear-input-btn" type="button" aria-label="Изчисти търсенето" hidden>&times;</button>
				</div>
				<div id="autocomplete" class="autocomplete" hidden></div>
			</div>
			<button id="reset-all" class="reset-btn" type="button">Изчисти филтрите</button>
		</div>
		<div id="category-filters" class="category-filters"></div>
	</header>
	<main>
		<div id="results" class="recipe-grid"></div>
		<div id="pagination" class="pagination"></div>
	</main>
	<script type="module" src="js/main.js"></script>
</body>
</html>
